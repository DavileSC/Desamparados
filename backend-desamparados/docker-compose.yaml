services:
  backend:
    build: .
    # OJO: Si tu código Node (index.ts) escucha en el puerto 3000,
    # cambia esta línea a: - "3001:3000"
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # CAMBIO CLAVE: Ahora apuntamos al nombre del servicio de abajo
      - DATABASE_HOST=mariadb_service
    depends_on:
      - mariadb_service

  mariadb_service:
    image: mariadb:10.11 # Versión recomendada
    restart: always
    environment:
      # Aquí mapeamos tus variables del .env a las que necesita MariaDB
      # Asegúrate de tener estas variables en tu archivo .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Contraseña maestra (puedes cambiarla)
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      # Esto guarda los datos aunque borres el contenedor
      - db_data:/var/lib/mysql

volumes:
  db_data: