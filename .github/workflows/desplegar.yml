name: Desplegar en el servidor

# Construye las imágenes de un commit de main, las sube al registro de GitHub
# (privado, como el repositorio) y las despliega en el VPS. Se lanza a mano,
# con el botón «Run workflow» de la pestaña Actions: en main se sube muchas
# veces al día desde dos equipos, y no todo tiene que llegar al servidor.
#
# Las imágenes se construyen aquí y no en el VPS porque compilar la web pide
# más de 1 GB de memoria, y allí, con ClamAV encendido, no sobra.
#
# Lo que necesita, una sola vez (docs/servidor.md, «Despliegue desde GitHub»):
#   - Secreto VPS_CLAVE_SSH: la clave privada con que entra al servidor. Allí
#     solo puede lanzar /usr/local/sbin/desplegar-desamparados.
#   - Secreto VPS_HUELLA: la línea de known_hosts del servidor, para no
#     fiarse de quien conteste en esa IP.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Para comprobar que la verificación de ese commit pasó.
  actions: read
  # Para subir las imágenes al registro y, en el servidor, descargarlas con el
  # token de esta misma ejecución, que caduca al terminar.
  packages: write

# Dos despliegues a la vez se pisarían en el servidor: el segundo espera.
concurrency:
  group: desplegar
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/davilesc/desamparados
  SERVIDOR: despliegue@51.255.45.220

# Acciones fijadas por SHA, como en verificacion.yml. Las de Docker, a su
# última versión el 05-10-2026.

jobs:
  comprobar:
    name: Comprobar el commit
    runs-on: ubuntu-latest
    steps:
      - name: Solo main, y con la verificación en verde
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Solo se despliega main (se ha lanzado sobre $GITHUB_REF)."
            exit 1
          fi
          verdes=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verificacion.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$verdes" -eq 0 ]; then
            echo "::error::La verificación de ${GITHUB_SHA:0:7} no ha pasado (o no ha terminado). Espera a que esté en verde."
            exit 1
          fi

  construir:
    name: Construir ${{ matrix.imagen }}
    needs: comprobar
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - imagen: api
            dockerfile: docker/api.Dockerfile
            target: ejecucion
          - imagen: herramientas
            dockerfile: docker/api.Dockerfile
            target: herramientas
          - imagen: web
            dockerfile: docker/web.Dockerfile
            target: servidor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Ninguna imagen lleva los datos de la corporación: la API y la web los
      # leen al arrancar del montaje ./instalacion del servidor. Por eso aquí
      # no hace falta ningún dato de nadie.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRO }}-${{ matrix.imagen }}:${{ github.sha }}
          # api y herramientas comparten casi todas las etapas: la misma caché.
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  probar-nginx:
    name: Probar la configuración de nginx
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # `nginx -t` con la imagen recién construida: un error de sintaxis en el
      # sitio dejaría la web caída en el servidor. Se prueban los dos sitios:
      # el de detrás del nginx del sistema (el que se usa hoy) y el de
      # producción, que necesita un certificado cualquiera para arrancar.
      #
      # Con `nginx` como orden, el entrypoint de la imagen pasa antes por
      # 40-instalacion.sh, como en el servidor: escribe la web y el sitio de
      # producción con los datos montados. Aquí, los de la corporación de ejemplo.
      - name: nginx -t
        run: |
          imagen="$REGISTRO-web:$GITHUB_SHA"
          datos="$PWD/shared/datos-entidad.ejemplo.json:/app/instalacion/datos-entidad.json:ro"
          docker pull --quiet "$imagen"
          echo "Sitio detrás del nginx del sistema:"
          docker run --rm -v "$datos" \
            -v "$PWD/docker/nginx/sitio-tras-proxy.conf:/etc/nginx/conf.d/desamparados.conf:ro" \
            "$imagen" nginx -t
          echo "Sitio de producción:"
          dominio=$(node -p "require('./shared/datos-entidad.ejemplo.json').identidad.dominio")
          mkdir -p "certs/live/$dominio"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$dominio" \
            -keyout "certs/live/$dominio/privkey.pem" -out "certs/live/$dominio/fullchain.pem" 2>/dev/null
          docker run --rm -v "$datos" -v "$PWD/certs:/etc/letsencrypt:ro" "$imagen" nginx -t

      # La web arrancada como en el servidor: lo que sirve tiene que llevar los
      # datos montados y ninguna marca de la plantilla (también comprimido, que
      # es lo que manda gzip_static), y /instalacion.js no se puede quedar en
      # la caché del navegador. Con unas fotos de la instalación montadas
      # (instalacion/imagenes), en 644/755 como en el servidor.
      - name: Prueba de humo
        run: |
          imagen="$REGISTRO-web:$GITHUB_SHA"
          nombre=$(node -p "require('./shared/datos-entidad.ejemplo.json').identidad.nombre")
          fotos=$(mktemp -d)
          mkdir "$fotos/cabeceras"
          cp shared/marca-de-partida/icono-192.png "$fotos/cabeceras/prueba.png"
          echo 'no es una foto' > "$fotos/notas.txt"
          chmod 755 "$fotos" "$fotos/cabeceras" && chmod 644 "$fotos/cabeceras/prueba.png" "$fotos/notas.txt"
          mapas=$(mktemp -d)
          echo '{"caja":[0,0,1,1]}' > "$mapas/barrio.json"
          chmod 755 "$mapas" && chmod 644 "$mapas/barrio.json"
          docker run -d --name web-humo -p 127.0.0.1:8099:80 \
            -v "$PWD/shared/datos-entidad.ejemplo.json:/app/instalacion/datos-entidad.json:ro" \
            -v "$fotos:/app/instalacion/imagenes:ro" \
            -v "$mapas:/app/instalacion/mapas:ro" \
            -v "$PWD/docker/nginx/sitio-tras-proxy.conf:/etc/nginx/conf.d/desamparados.conf:ro" \
            "$imagen" >/dev/null
          trap 'docker logs web-humo; docker rm -f web-humo >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          mal=0
          for ruta in / /instalacion.js /manifest.json /robots.txt; do
            if ! cuerpo=$(curl -fsS --compressed "http://127.0.0.1:8099$ruta"); then
              echo "::error::$ruta no responde."; mal=1; continue
            fi
            if printf '%s' "$cuerpo" | grep -q '{{'; then echo "::error::$ruta lleva marcas sin rellenar."; mal=1; fi
            case "$ruta" in
              /robots.txt) esperado="Sitemap: https://$(node -p "require('./shared/datos-entidad.ejemplo.json').identidad.dominio")/sitemap.xml" ;;
              *) esperado="$nombre" ;;
            esac
            printf '%s' "$cuerpo" | grep -qF "$esperado" || { echo "::error::$ruta no lleva «$esperado»."; mal=1; }
          done
          curl -fsSI http://127.0.0.1:8099/instalacion.js | grep -qi '^cache-control: no-cache' \
            || { echo "::error::/instalacion.js sin Cache-Control: no-cache."; mal=1; }
          # La marca: aquí no hay carpeta montada, así que es la de partida. El
          # escudo, los iconos del manifest y el og:image tienen que servirse
          # como imágenes (sin /marca/ en la imagen, el reenvío de la SPA daría
          # la portada con un 200 y nadie lo notaría).
          es_imagen() {
            tipo=$(curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8099$1") \
              && case "$tipo" in image/png|image/jpeg) true ;; *) false ;; esac \
              || { echo "::error::$1 no se sirve como imagen (${tipo:-sin respuesta})."; mal=1; }
          }
          es_imagen /marca/escudo-sobre-oscuro.png
          for icono in $(curl -fsS http://127.0.0.1:8099/manifest.json | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>console.log(JSON.parse(t).icons.map(i=>i.src).join(" ")))'); do
            es_imagen "$icono"
          done
          og=$(curl -fsS --compressed http://127.0.0.1:8099/ | sed -n 's/.*<meta property="og:image" content="https:\/\/[^/]*\([^"]*\)".*/\1/p')
          if [ -n "$og" ]; then es_imagen "$og"; else echo "::error::index.html sin og:image."; mal=1; fi
          # Los iconos viejos de la raíz, trasladados.
          for viejo in /favicon.ico /favicon-32.png /apple-touch-icon.png /icono-192.png /icono-512.png; do
            curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:8099$viejo" | grep -q '^301 .*/marca/' \
              || { echo "::error::$viejo no redirige a /marca/."; mal=1; }
          done
          # Las fotos de la instalación, del montaje y no de la imagen. Lo que
          # no está, o no es una foto, es un 404: nunca la portada con un 200.
          es_imagen /images/cabeceras/prueba.png
          for ruta in /images/no-esta.webp /images/notas.txt /images/cabeceras/; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099$ruta")
            [ "$codigo" = 404 ] || { echo "::error::$ruta da $codigo y no 404."; mal=1; }
          done
          # El mapa del barrio, también del montaje.
          curl -fsS http://127.0.0.1:8099/mapas/barrio.json | grep -q '"caja"' \
            || { echo "::error::/mapas/barrio.json no sirve el del montaje."; mal=1; }
          exit "$mal"

      # Sin instalacion/mapas ni instalacion/imagenes (otra corporación), el
      # barrio y las fotos son un 404, nunca la portada con un 200.
      - name: Prueba de humo sin mapa ni fotos
        run: |
          imagen="$REGISTRO-web:$GITHUB_SHA"
          docker run -d --name web-sin -p 127.0.0.1:8098:80 \
            -v "$PWD/shared/datos-entidad.ejemplo.json:/app/instalacion/datos-entidad.json:ro" \
            -v "$PWD/docker/nginx/sitio-tras-proxy.conf:/etc/nginx/conf.d/desamparados.conf:ro" \
            "$imagen" >/dev/null
          trap 'docker logs web-sin; docker rm -f web-sin >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8098/ && break; sleep 1; done
          mal=0
          for ruta in /mapas/barrio.json /images/hero-1920.webp; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8098$ruta")
            [ "$codigo" = 404 ] || { echo "::error::Sin montaje, $ruta da $codigo y no 404."; mal=1; }
          done
          exit "$mal"

      # La marca montada, como en el servidor (instalacion/marca): se usan sus
      # ficheros y no los de partida. Aquí se monta la propia marca de partida,
      # que basta para ver que el montaje se lee. Y una marca con un fichero
      # que no es lo que dice su nombre impide arrancar y lo dice.
      - name: Prueba de humo de la marca
        run: |
          imagen="$REGISTRO-web:$GITHUB_SHA"
          datos="$PWD/shared/datos-entidad.ejemplo.json:/app/instalacion/datos-entidad.json:ro"
          sitio="$PWD/docker/nginx/sitio-tras-proxy.conf:/etc/nginx/conf.d/desamparados.conf:ro"
          mal=0
          salida=$(docker run --rm -v "$datos" -v "$sitio" -v "$PWD/shared/marca-de-partida:/app/instalacion/marca:ro" "$imagen" nginx -t 2>&1) \
            || { echo "$salida"; echo "::error::Con la marca montada, la web no arranca."; mal=1; }
          printf '%s\n' "$salida" | grep -q '\[marca\] escudo-sobre-oscuro.png: de la instalación' \
            || { echo "$salida"; echo "::error::Con la marca montada, no se usa su escudo."; mal=1; }
          rota=$(mktemp -d)
          echo 'esto no es un PNG' > "$rota/escudo-sobre-oscuro.png"
          chmod 755 "$rota" && chmod 644 "$rota/escudo-sobre-oscuro.png"
          if salida=$(docker run --rm -v "$datos" -v "$sitio" -v "$rota:/app/instalacion/marca:ro" "$imagen" nginx -t 2>&1); then
            echo "$salida"; echo "::error::Con un escudo que es un texto, la web arranca igual."; mal=1
          fi
          printf '%s\n' "$salida" | grep -q 'escudo-sobre-oscuro.png: no es una imagen PNG' \
            || { echo "$salida"; echo "::error::Con un escudo que es un texto, no dice qué fichero falla."; mal=1; }
          exit "$mal"

  desplegar:
    name: Desplegar en el VPS
    needs: probar-nginx
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar ${{ github.sha }}
        env:
          CLAVE: ${{ secrets.VPS_CLAVE_SSH }}
          HUELLA: ${{ secrets.VPS_HUELLA }}
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLAVE" ] || [ -z "$HUELLA" ]; then
            echo "::error::Faltan los secretos VPS_CLAVE_SSH y VPS_HUELLA (docs/servidor.md, «Despliegue desde GitHub»)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/clave && chmod 600 ~/.ssh/clave
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts
          # En el servidor, la clave solo lanza el guion de despliegue, que
          # recibe el commit como orden y el token por la entrada estándar
          # (nunca en la línea de órdenes, donde lo vería `ps`).
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/clave -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SERVIDOR" "$GITHUB_SHA"
