name: Verificación

# Comprueba los dos proyectos en cada push y en cada pull request.
#
# Existe porque la ruta de administración de noticias se quedó sin
# autenticación durante días sin que nada lo detectara: los tests, el typecheck
# y la auditoría de dependencias solo se ejecutaban si alguien se acordaba.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El token del job solo puede leer el repositorio: ningún paso necesita
# escribir, y así una dependencia comprometida que se ejecute durante `npm ci`
# no puede tocar ramas, releases ni issues.
permissions:
  contents: read

# Un push nuevo cancela la comprobación anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aquí no hay instalación: la siembra, la compilación y las pruebas usan la
# corporación de ejemplo (relativa a la raíz del repositorio; ver
# shared/datos-entidad.mjs). Así también se ve si algo depende de Desamparados.
env:
  DATOS_ENTIDAD: shared/datos-entidad.ejemplo.json

# Las acciones van fijadas por SHA de commit y no por etiqueta: una etiqueta se
# puede mover y ejecutar código distinto sin que cambie este fichero. El
# comentario dice a qué versión corresponde cada SHA (v4 apuntaba a v4.4.0 el
# 11-09-2026). Para actualizar: `gh api repos/actions/checkout/git/ref/tags/vX.Y.Z`.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-desamparados

    # MariaDB de verdad: sin ella se omiten todas las pruebas que tocan la base,
    # entre ellas las de sesión y permisos. Usuario y base coinciden con las
    # variables de abajo; la imagen crea el usuario con todos los permisos
    # sobre esa base. 11.8, la misma que en desarrollo: trae
    # innodb_snapshot_isolation=ON, que cambia qué pasa con dos escrituras a
    # la vez (error 1020), y conviene que el CI lo vea igual.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: ci_desamparados
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        # El job no empieza hasta que MariaDB acepta conexiones.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Valores de relleno, no secretos. src/config/db.ts exige las cuatro
    # DATABASE_* por separado, prisma.config.ts la URL, y el módulo que firma
    # tokens se niega a cargarse sin JWT_SECRET (ver docs/notas-del-proyecto.md,
    # sección 3). Apuntan al servicio mariadb de arriba.
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_desamparados
      DATABASE_HOST: 127.0.0.1
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_NAME: ci_desamparados
      JWT_SECRET: valor-de-relleno-solo-para-la-verificacion-automatica
      NODE_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Sin guardar el token en .git/config: ningún paso hace push.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend-desamparados/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # El cliente de Prisma se genera a partir del esquema y no está
      # versionado: sin este paso el typecheck falla con tipos inexistentes.
      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Validar el esquema de Prisma
        run: npx prisma validate

      # `tsconfig.test.json` y no el de siempre: el principal excluye
      # `**/*.test.ts`, así que las pruebas quedaban fuera del compilador y una
      # que dejara de probar lo que dice seguía pasando. Este las incluye.
      - name: Comprobar tipos (código y pruebas)
        run: npm run comprobar-tipos

      # Si MariaDB no respondiera, este paso falla: las pruebas nunca llegan a
      # ejecutarse «en verde» con la mitad omitidas.
      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      # Un cambio en schema.prisma sin su migración pasaba en verde (el cliente
      # se genera del esquema) y rompía el despliegue. Con la base ya migrada,
      # cualquier diferencia con el esquema es una migración que falta.
      - name: Esquema sin migración pendiente
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # Con NODE_ENV=test la siembra crea las cuentas de desarrollo, el
      # contenido de ejemplo y el censo de demostración: varias pruebas de
      # paginación se omiten si no hay al menos dos páginas de datos.
      - name: Sembrar datos de prueba
        run: npx prisma db seed

      - name: Pruebas
        # Además de la salida normal, un informe TAP para el paso siguiente.
        # Un fichero detrás de otro, como `npm test`: comparten la base de datos
        # y varios trabajan sobre su estado global (ver docs/notas-del-proyecto.md).
        run: >-
          npx tsx --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap --test-reporter-destination=pruebas.tap
          "test/**/*.test.ts"

      # «Omitido no es pasado» (docs/notas-del-proyecto.md, sección 6): con la
      # base de datos levantada, una prueba omitida por falta de MariaDB es
      # que algo no conecta, y el job debe fallar en vez de quedar en verde.
      # Las omisiones por otros motivos se listan como aviso. Todas las de
      # «sin base» salen de backend-desamparados/test/fixtures/sin-db.ts y
      # empiezan por «requiere MariaDB»; test/omisiones-sin-db.test.ts impide
      # que una prueba escriba su propio motivo con otro texto, que esta
      # guarda no vería.
      - name: Comprobar que no se ha omitido ninguna prueba por falta de base de datos
        if: always()
        run: |
          if [ ! -f pruebas.tap ]; then echo "::error::No se generó pruebas.tap"; exit 1; fi
          grep -E '# SKIP' pruebas.tap | sed -E 's/^ *ok [0-9]+ - /::warning::Omitida: /' || true
          if grep -q '# SKIP requiere MariaDB' pruebas.tap; then
            echo "::error::Hay pruebas omitidas por falta de MariaDB aunque el servicio está levantado."
            exit 1
          fi

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desamparados-web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desamparados-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        # `-b` como en local (CLAUDE.md): el proyecto usa project references y
        # así se comprueban todas, también la de vite.config.ts.
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Construir
        run: npm run build

      # `npm run build` regenera la lista de páginas del sitemap desde el router
      # (shared/rutas-publicas.json, que sirve la API): si quedó desincronizada
      # en el commit, aquí se ve como un cambio sin registrar. Antes miraba
      # public/sitemap.xml, que ya no existe, y el paso fallaba siempre.
      - name: Comprobar que la lista del sitemap está al día
        run: git diff --exit-code ../shared/rutas-publicas.json

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
