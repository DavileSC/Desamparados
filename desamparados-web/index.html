<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      El escudo del Grupo, sobre la tinta del sitio. Los genera
      `scripts/generar-iconos.mjs` a partir de `images/escudo-grupo.png`, que es
      blanco sobre transparente y como icono suelto no se vería.

      `apple-touch-icon.png` es el que usa iOS al guardar la web en la pantalla
      de inicio, y lo busca por ese nombre exacto.

      `theme-color` tiñe la barra del navegador en Android: va de la tinta de la
      barra de navegación, que es lo que se ve justo debajo.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070608" />
    <meta name="description" content="Grupo Parroquial de Nuestra Señora de los Desamparados de Málaga. Devoción, historia y patrimonio en el corazón de la ciudad." />
    <title>Grupo Parroquial Nuestra Señora de los Desamparados | Málaga</title>

    <!--
      La vista previa al pegar un enlace (WhatsApp, Facebook, X…).

      Va aquí, en el HTML estático, y no solo en `MetaDePagina`: esos robots NO
      ejecutan JavaScript, así que de una web como esta —sin renderizado en el
      servidor— solo leen este fichero. Lo que pone React con Helmet lo ve
      Google, que sí ejecuta, pero no el que comparte una noticia por WhatsApp.

      Por eso estas son las del sitio, no las de cada página: hacen que
      cualquier enlace se vea como del Grupo Parroquial, con su foto, en vez de
      como un enlace pelado. Para que cada página traiga la suya haría falta
      prerenderizar o servir el HTML desde el servidor.

      `og:url` no va: el robot usa la dirección que ha pedido, y una fija aquí
      apuntaría siempre a la portada.
    -->
    <meta property="og:site_name" content="Grupo Parroquial Nuestra Señora de los Desamparados" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Grupo Parroquial Nuestra Señora de los Desamparados | Málaga" />
    <meta property="og:description" content="Grupo Parroquial de Nuestra Señora de los Desamparados de Málaga. Devoción, historia y patrimonio en el corazón de la ciudad." />
    <meta property="og:image" content="https://www.desamparadosmalaga.com/images/hero-1920.webp" />
    <meta property="og:image:alt" content="Nuestra Señora de los Desamparados" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Quién es el Grupo Parroquial, en el formato que leen los buscadores
      (schema.org). Es lo que alimenta el panel lateral de Google y lo que
      relaciona esta web con los perfiles oficiales.

      Está aquí y no en React por lo mismo que las etiquetas de arriba: así
      viaja en el HTML tal cual, sin depender de que nadie ejecute JavaScript.
      `src/config/site.ts` sigue siendo la fuente de verdad y
      `__tests__/datos-estructurados.test.ts` compara los dos: si cambia un
      perfil o el correo y aquí no, el test lo dice.

      NO lleva `legalName`, `taxID` ni la dirección fiscal: son los datos que
      siguen pendientes de confirmar en `site.ts`. Un dato inventado aquí lo
      publicaría Google como bueno. `location` sí va: es dónde está la
      parroquia, que es un dato real y el que busca quien quiere venir.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ReligiousOrganization",
        "name": "Grupo Parroquial de Nuestra Señora de los Desamparados",
        "url": "https://www.desamparadosmalaga.com/",
        "email": "info@desamparadosmalaga.com",
        "image": "https://www.desamparadosmalaga.com/images/hero-1920.webp",
        "sameAs": [
          "https://www.facebook.com/desamparadosmalaga/",
          "https://www.instagram.com/desamparadosmalaga/",
          "https://x.com/GPDesamparados"
        ],
        "location": {
          "@type": "Place",
          "name": "Iglesia Parroquial Santa María Goretti",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "C. Corregidor Paz Guzmán, 13",
            "addressLocality": "Málaga",
            "addressCountry": "ES"
          }
        }
      }
    </script>
    <!-- Imagen LCP de la portada: la precargamos en la versión que toque según el viewport -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
