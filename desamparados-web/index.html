<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Una sola web para cualquier corporación: lo que dice quién es no se
      compila dentro. /instalacion.js (window.__INSTALACION__, que lee
      src/config/instalacion.ts) y la cabecera de abajo los escribe la API con
      lo guardado en el CMS (Sistema → Datos de la corporación), al arrancar y
      cada vez que se cambia el nombre, un color o una imagen; en desarrollo,
      si la API local no los ha escrito, el plugin de Vite los compone del
      fichero de la instalación.

      Script clásico, sin defer y antes que el código de la web: tiene que
      estar ejecutado cuando arranque main.tsx. Vite avisa al construir de que
      no lo empaqueta; es lo que se quiere.
    -->
    <script src="/instalacion.js"></script>

    <!--
      Título, descripción, iconos, la vista previa al compartir y el JSON-LD,
      de shared/cabecera.plantilla.html: nginx cambia esta línea por la
      cabecera que escribe la API (SSI), y así un nombre nuevo se ve sin
      reiniciar nada; Vite, en desarrollo, por la misma cabecera.
    -->
    <!--# include virtual="/_cabecera" -->
    <!-- Imagen LCP de la portada: la precargamos en la versión que toque según el viewport -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
