<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Una sola web para cualquier corporación: lo que dice quién es no se
      compila dentro. Las marcas entre llaves dobles de este fichero (nunca
      en un comentario: se publicarían tal cual) y /instalacion.js
      (window.__INSTALACION__, que lee src/config/instalacion.ts) los escribe
      scripts/instalacion-web.mjs con instalacion/datos-entidad.json: al
      arrancar el contenedor de la web y, en desarrollo, el plugin de Vite.

      Script clásico, sin defer y antes que el código de la web: tiene que
      estar ejecutado cuando arranque main.tsx. Vite avisa al construir de que
      no lo empaqueta; es lo que se quiere.
    -->
    <script src="/instalacion.js"></script>

    <!--
      El escudo del Grupo, sobre la tinta del sitio. Los genera
      `scripts/generar-iconos.mjs` a partir de `images/escudo-grupo.png`, que es
      blanco sobre transparente y como icono suelto no se vería.

      `apple-touch-icon.png` es el que usa iOS al guardar la web en la pantalla
      de inicio, y lo busca por ese nombre exacto.

      `theme-color` tiñe la barra del navegador en Android: va de la tinta de la
      barra de navegación, que es lo que se ve justo debajo.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070608" />
    <meta name="description" content="{{descripcion}}" />
    <title>{{nombre}} | {{localidad}}</title>

    <!--
      La vista previa al pegar un enlace (WhatsApp, Facebook, X…).

      Va aquí, en el HTML estático, y no solo en `MetaDePagina`: esos robots NO
      ejecutan JavaScript, así que de una web como esta —sin renderizado en el
      servidor— solo leen este fichero. Lo que pone React con Helmet lo ve
      Google, que sí ejecuta, pero no el que comparte una noticia por WhatsApp.

      Por eso estas son las del sitio, no las de cada página: hacen que
      cualquier enlace se vea como del Grupo Parroquial, con su foto, en vez de
      como un enlace pelado. Para que cada página traiga la suya haría falta
      prerenderizar o servir el HTML desde el servidor.

      `og:url` no va: el robot usa la dirección que ha pedido, y una fija aquí
      apuntaría siempre a la portada.
    -->
    <meta property="og:site_name" content="{{nombre}}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="{{nombre}} | {{localidad}}" />
    <meta property="og:description" content="{{descripcion}}" />
    <meta property="og:image" content="{{url}}/images/hero.jpg" />
    <meta property="og:image:alt" content="{{titular}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Quién es el Grupo Parroquial, en el formato que leen los buscadores
      (schema.org). Es lo que alimenta el panel lateral de Google y lo que
      relaciona esta web con los perfiles oficiales.

      Está aquí y no en React por lo mismo que las etiquetas de arriba: así
      viaja en el HTML tal cual, sin depender de que nadie ejecute JavaScript.
      Aquí va solo lo que no cambia: el nombre, la denominación jurídica y la
      dirección de la web, de `instalacion/datos-entidad.json` al rellenar
      este fichero (scripts/instalacion-web.mjs), los mismos que lee
      `src/config/site.ts`. El correo, el teléfono, la sede y los perfiles se
      cambian en el CMS, y escritos aquí se quedarían viejos: los añade la
      portada (components/DatosEstructurados.tsx), que Google también lee.

      Un dato pendiente (`null` en el JSON) hace desaparecer su línea: un dato
      inventado aquí lo publicaría Google como bueno. No lleva `taxID`: el Grupo
      Parroquial no quiere publicar su NIF.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ReligiousOrganization",
        "name": "{{json:nombre}}",
        "legalName": "{{json:denominacion}}",
        "url": "{{json:url}}/",
        "image": "{{json:url}}/images/hero-1920.webp"
      }
    </script>
    <!-- Imagen LCP de la portada: la precargamos en la versión que toque según el viewport -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
