<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a0c" />
    <title>Rosario vespertino en directo</title>
    <meta name="description" content="Por dónde va el Rosario vespertino del Grupo Parroquial Nuestra Señora de los Desamparados, en directo sobre el mapa." />
    <meta property="og:title" content="Rosario vespertino en directo" />
    <meta property="og:description" content="Sigue por dónde va el Rosario del Grupo Parroquial Nuestra Señora de los Desamparados." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="mapa" role="img" aria-label="Mapa del recorrido del Rosario vespertino por el barrio"></div>
    <header class="cabecera">
      <img class="marca" src="./desamparados-malaga.webp" width="800" height="46" alt="Desamparados Málaga" />
      <h1><img src="./rosario-vespertino.webp" width="1000" height="213" alt="Rosario vespertino 2026" /></h1>
    </header>
    <section class="pie" aria-live="polite">
      <div class="pie-dentro">
        <p id="estado"><span id="titulo">Cargando el mapa…</span><time id="hora"></time></p>
        <p id="detalle"></p>
        <div class="botones">
          <button type="button" id="seguir" aria-pressed="false" disabled>Seguir al trono</button>
          <button type="button" id="entero" aria-pressed="true">Recorrido entero</button>
        </div>
        <!-- redes -->
      </div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
