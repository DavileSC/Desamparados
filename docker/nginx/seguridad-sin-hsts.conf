# El mismo fragmento que desamparados-seguridad.conf SIN
# Strict-Transport-Security, y solo para la prueba en local.
#
# Por qué: HSTS se fija por HOST, sin distinguir el puerto. Una sola visita a
# https://localhost:8443 con esa cabecera dejaría el navegador obligando a
# HTTPS en *cualquier* http://localhost —el resto de proyectos de esta
# máquina— durante dos años, y la única forma de deshacerlo es a mano en
# chrome://net-internals/#hsts. Se omite aquí y solo aquí; el sitio de
# producción la lleva.
#
# Lo demás es idéntico a seguridad.conf a propósito: si se cambia una
# directiva allí, hay que cambiarla también aquí.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src 'self' https://www.google.com https://www.youtube-nocookie.com https://player.vimeo.com; upgrade-insecure-requests" always;
