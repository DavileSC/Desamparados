# Directivas del contexto `http`. La imagen oficial de nginx incluye
# /etc/nginx/conf.d/*.conf dentro de `http`, y este fichero se llama
# 00-comun.conf allí dentro para que se cargue antes que el sitio.

# No anunciar la versión de nginx en las cabeceras ni en las páginas de error.
server_tokens off;

# Registro de accesos SIN la consulta de la URL. Con el formato por defecto
# (`combined`) quedarían en disco:
#  - el token de recuperación de contraseña: el enlace del correo es
#    /reset-password?token=... (la API lo recibe en el cuerpo, nunca en la
#    ruta);
#  - las búsquedas del censo, que van en ?q= con nombres y DNI.
# Tampoco se registran el Referer (la página de recuperación lo manda con el
# token a cada recurso que carga) ni el agente de usuario, que no hacen falta.
map $request_uri $ruta_registro {
    ~^(?<ruta_sin_consulta>[^?]*)     $ruta_sin_consulta;
}
log_format desamparados '$time_iso8601 $remote_addr "$request_method $ruta_registro $server_protocol" '
                        '$status $body_bytes_sent $request_time';

# La IP que ve nginx es la del cliente (llega directa al puerto publicado del
# contenedor). La que la API necesita va en X-Forwarded-For, que ponen los
# `location` de abajo.

# Compresión. La web va ya comprimida desde la imagen (web.Dockerfile): con
# gzip_static nginx manda el .gz que hay al lado de cada fichero, sin gastar
# CPU. Lo demás de texto (el JSON de la API) se comprime al vuelo, flojo,
# que el VPS es pequeño. Fotos, vídeos y PDF no entran en gzip_types: ya van
# comprimidos y los vídeos se sirven por trozos (Range). El canal de la mesa
# de procesión (text/event-stream) tampoco: lo comprimido no sale hasta
# llenar el búfer y el directo dejaría de serlo.
gzip_static on;
gzip on;
gzip_vary on;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

# Estadísticas de visitas (módulo «estadisticas-de-visitas»). La web es una
# SPA: el servidor solo ve la primera página de cada visita, así que la web
# pública avisa de cada página vista con /visita?ruta=…&ref=…
# (src/hooks/useContarVisitas.ts). Va a un registro aparte, en el formato
# combinado que lee GoAccess (docker/servidor/estadisticas.sh), y con la IP
# recortada: sin el último número en IPv4 y con solo los tres primeros grupos
# en IPv6. Nunca se guarda la IP entera ni la consulta de la página, y no hay
# cookies: por eso no hace falta pedir consentimiento.
map $remote_addr $ip_recortada {
    ~^(?<red4>\d+\.\d+\.\d+)\.\d+$                                   $red4.0;
    ~^(?<red6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):                 $red6::;
    default                                                             0.0.0.0;
}
map $arg_ruta $pagina_vista { "" "/"; default $arg_ruta; }
map $arg_ref $procedencia { "" "-"; default $arg_ref; }
# Solo lo que se contestó bien: lo frenado por el límite de abajo no cuenta.
map $status $apuntar_visita { 204 1; default 0; }
log_format visitas '$ip_recortada - - [$time_local] "GET $pagina_vista HTTP/1.1" 200 0 "$procedencia" "$http_user_agent"';
# Nadie lee páginas a más de dos por segundo: más que eso es alguien
# llenando el disco o inflando las cifras.
limit_req_zone $binary_remote_addr zone=visitas:1m rate=2r/s;
