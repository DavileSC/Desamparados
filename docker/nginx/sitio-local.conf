# El sitio, para la prueba en esta máquina. compose.local.yaml lo monta encima
# de /etc/nginx/conf.d/desamparados.conf, sustituyendo al de producción.
#
# Es el mismo montaje, con tres diferencias y ninguna más:
#
#   1. El certificado es autofirmado y el nombre es `localhost` (no hay
#      dominio contratado). Lo genera el servicio `certificado-local`.
#   2. No se manda Strict-Transport-Security, ni desde aquí ni dejándola pasar
#      desde helmet. HSTS se fija por host y sin mirar el puerto: una visita a
#      https://localhost:8443 obligaría a HTTPS en cualquier http://localhost
#      de esta máquina durante dos años.
#   3. Los puertos del host son 8080 y 8443, para no pelearse con nada que ya
#      esté escuchando en el 80 y el 443.
#
# Se sirve por HTTPS y no por HTTP a propósito: con NODE_ENV=production la
# cookie de sesión lleva `Secure` y el navegador no la guardaría en una página
# http://. Sin esto no se podría probar el CMS, que es justo lo que hay que
# probar.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Al puerto del host, no al 443, que aquí no está publicado.
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certificados-local/cert.pem;
    ssl_certificate_key /etc/nginx/certificados-local/key.pem;

    access_log /dev/stdout desamparados;
    error_log  /dev/stderr warn;

    root /var/www/desamparados/dist;
    index index.html;

    client_max_body_size 1m;

    # nginx resuelve el nombre `api` UNA VEZ al arrancar y se queda con la IP.
    # Al recrear ese contenedor (un despliegue, `up -d api` tras cambiar el
    # .env) cambia de IP y nginx seguiría hablando con la vieja: 502 hasta
    # reiniciarlo también. Con el DNS interno de Docker y el destino en una
    # variable, lo vuelve a resolver cada 30 s.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $destino_api http://api:3001;

    location /assets/ {
        include snippets/desamparados-seguridad-sin-hsts.conf;
        # Una sola cabecera: `expires 1y` emite su propio Cache-Control y el
        # navegador recibiría dos, con distinto contenido.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        include snippets/desamparados-seguridad-sin-hsts.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        include snippets/desamparados-seguridad-sin-hsts.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include snippets/desamparados-seguridad-sin-hsts.conf;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 3m;
        proxy_pass $destino_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Helmet la pone con NODE_ENV=production. Ver el punto 2 de arriba.
        proxy_hide_header Strict-Transport-Security;
    }

    location = /sitemap.xml {
        proxy_pass $destino_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
    }

    location = /api/auth/register {
        client_max_body_size 16m;
        proxy_pass $destino_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
    }

    location /api/upload/ {
        client_max_body_size 25m;
        proxy_pass $destino_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
    }

    location /storage/public/ {
        alias /srv/storage/public/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        location ~ /\. { deny all; }
    }
}
