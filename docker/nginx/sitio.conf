# El sitio, en producción. Dentro del contenedor los puertos son siempre 80 y
# 443; el compose los publica en los mismos del servidor.
#
# __DOMINIO__ y __DOMINIO_SIN_WWW__ los rellena docker/nginx/generar-sitio.mjs al
# construir la imagen, con el dominio de instalacion/datos-entidad.json: el mismo que
# usa la web para su dirección canónica. Aquí no se escribe ninguno a mano.
#
# Web y API comparten dominio, con /api/ como ruta. No es una preferencia:
# la sesión viaja en una cookie httpOnly con SameSite=Strict y Path=/api, y
# con la API en otro dominio el navegador no la mandaría. Ver
# docs/despliegue.md, «Decidido: mismo dominio para web y API».

# Todo lo que llegue por http se manda a https, salvo el desafío de Let's
# Encrypt, que tiene que responder por el 80 para que certbot renueve.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__ __DOMINIO_SIN_WWW__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMINIO__$request_uri;
    }
}

# https sin www: también a www. Sin este bloque, el único servidor 443
# atendería `__DOMINIO_SIN_WWW__` tal cual: sesiones distintas en cada
# nombre (la cookie es de un solo host) y el HSTS solo en www. El certificado
# tiene que cubrir los dos nombres (`certbot -d www… -d …`).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMINIO_SIN_WWW__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;

    return 301 https://__DOMINIO__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;

    set $proto_original $scheme;
    include snippets/desamparados-ubicaciones.conf;
}
