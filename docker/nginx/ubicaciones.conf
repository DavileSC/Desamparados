# Lo que sirve el sitio, común al de producción (sitio.conf) y al que va detrás
# del nginx del sistema (sitio-tras-proxy.conf). Se incluye dentro de su
# `server`, que antes tiene que fijar `$proto_original`: el esquema con que
# llegó el visitante, para el X-Forwarded-Proto de la API. En producción es
# $scheme; detrás de otro nginx, el que mande ese.
#
# El sitio local (sitio-local.conf) no lo usa: allí cambian las cabeceras de
# HSTS de cada ruta.

# A la salida estándar y de error, que es de donde las recoge
# `docker compose logs` con la rotación configurada en el compose.
access_log /dev/stdout desamparados;
error_log  /dev/stderr warn;

root /var/www/desamparados/dist;
index index.html;

# Tope de cuerpo para todo lo que no diga otra cosa: la web estática no
# recibe cuerpos. Las rutas de la API lo suben abajo.
client_max_body_size 1m;

# nginx resuelve el nombre `api` UNA VEZ al arrancar y se queda con la IP.
# Al recrear ese contenedor (un despliegue, `up -d api` tras cambiar el
# .env) cambia de IP y nginx seguiría hablando con la vieja: 502 hasta
# reiniciarlo también. Con el DNS interno de Docker y el destino en una
# variable, lo vuelve a resolver cada 30 s.
resolver 127.0.0.11 valid=30s ipv6=off;
set $destino_api http://api:3001;

# OJO con `add_header`: un `location` que tenga alguno propio NO hereda los
# del `server`. Por eso aquí no hay ninguno a nivel de server y el fragmento
# se incluye en cada `location` de la web. La API no lo incluye y, al no
# haber nada que heredar, solo lleva las cabeceras de helmet (si lo
# heredara, llevaría las dos versiones de cada cabecera, y con dos CSP el
# navegador aplica ambas).

# Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
location /assets/ {
    include snippets/desamparados-seguridad.conf;
    # Una sola cabecera: `expires 1y` emite su propio Cache-Control y el
    # navegador recibiría dos, con distinto contenido.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Las fotos fijas de la corporación (el hero, las cabeceras, el ajuar…), que
# no van en la imagen: viven en instalacion/imagenes/ y se leen del montaje,
# sin copiarlas en cada arranque como la marca (son megas, y el VPS es
# justo). Por eso nginx (su propio usuario, no root) tiene que poder leerlas:
# ficheros en 644 y carpetas en 755, `instalacion/` incluida; si no, 403. La
# dirección no cambia (/images/…) porque la base de datos ya guarda esas URL en
# las páginas y la portada. Sin la carpeta, cada una es un 404 (nunca la
# portada: `alias` no pasa por el reenvío de la SPA) y la web pinta su fondo.
#
# No llevan hash en el nombre, así que nada de `immutable`: una semana, que es
# lo que tardaría en verse una sustituida con el mismo nombre.
location /images/ {
    alias /app/instalacion/imagenes/;
    autoindex off;
    include snippets/desamparados-seguridad.conf;
    add_header Cache-Control "public, max-age=604800";
    # Ni ficheros ocultos ni nada que no sea una foto: la carpeta la llena
    # quien instala, y un .txt o un .html olvidado allí no tiene por qué salir.
    location ~ /\. { deny all; }
    location ~* \.(?:webp|jpe?g|png|avif|gif)$ {
        include snippets/desamparados-seguridad.conf;
        add_header Cache-Control "public, max-age=604800";
    }
    return 404;
}

# El mapa del barrio (calles de OpenStreetMap alrededor del recorrido), de la
# instalación como las fotos: instalacion/mapas/barrio.json, leído del montaje
# (644, y sus carpetas 755). Sin él, 404 y la web enseña el recorrido en lista.
# Pesa más de un mega: si al lado hay un barrio.json.gz, gzip_static manda ese
# y el VPS no comprime en cada visita. Un día de caché: se regenera muy poco.
# Las fuentes del mapa (/mapas/fuentes/) siguen en la web: son genéricas.
location = /mapas/barrio.json {
    alias /app/instalacion/mapas/barrio.json;
    include snippets/desamparados-seguridad.conf;
    add_header Cache-Control "public, max-age=86400";
}

# La marca de la corporación (el escudo y los iconos), que el arranque copia
# de instalacion/marca/ (instalacion-web.mjs). Una semana, como las fotos: las
# páginas la piden con `?v=<hash del contenido>`, así que un escudo nuevo se
# ve al instante sin esperar a que caduque el viejo. Sin reenvío a la SPA: un
# fichero que no está es un 404, no la portada con tipo de imagen.
location /marca/ {
    include snippets/desamparados-seguridad.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

# Los iconos vivían en la raíz hasta la etapa 4 de la Fase 8. Los navegadores
# y los móviles que guardaron la web los siguen pidiendo ahí (y /favicon.ico lo
# piden todos sin mirar el HTML): sin esto, el reenvío de la SPA les daría la
# portada en vez de un icono. 301: es un traslado para siempre.
location = /favicon.ico {
    include snippets/desamparados-seguridad.conf;
    # Relativa: detrás del nginx del sistema, la absoluta llevaría el host y
    # el esquema de dentro del contenedor (http://127.0.0.1/…).
    absolute_redirect off;
    return 301 /marca/favicon-32.png;
}
location ~ ^/(favicon-32|apple-touch-icon|icono-192|icono-512)\.png$ {
    include snippets/desamparados-seguridad.conf;
    absolute_redirect off;
    return 301 /marca/$1.png;
}

# La parroquia se llamaba como la orden que la atiende hasta el 12-10-2026.
# La web también redirige (DireccionAntigua), pero un 301 de verdad es lo que
# entienden los buscadores. El `#…` no llega al servidor: lo conserva el
# navegador al seguir la redirección.
location = /parroquia-pasionistas {
    include snippets/desamparados-seguridad.conf;
    absolute_redirect off;
    return 301 /parroquia$is_args$args;
}

# index.html NUNCA se cachea: es quien apunta a los assets nuevos tras cada
# despliegue. Si se cachea, los visitantes siguen viendo la versión vieja.
location = /index.html {
    include snippets/desamparados-seguridad.conf;
    add_header Cache-Control "no-cache";
}

# Los datos de la corporación (window.__INSTALACION__), que escribe el
# arranque del contenedor: tampoco se cachean. Al cambiarlos y reiniciar la
# web, un navegador con el viejo en caché pintaría el nombre de antes.
location = /instalacion.js {
    include snippets/desamparados-seguridad.conf;
    add_header Cache-Control "no-cache";
}

# El reenvío de la SPA. Sin esto, las rutas internas dan 404: el router
# vive en el navegador y /actualidad/noticias no es un fichero.
location / {
    include snippets/desamparados-seguridad.conf;
    try_files $uri $uri/ /index.html;
}

# La API, detrás del mismo dominio. 3 MB: las noticias, páginas y
# publicaciones del CMS admiten hasta 2 MB de JSON; el resto de la API
# corta en 100 KB por su cuenta.
location /api/ {
    client_max_body_size 3m;
    proxy_pass $destino_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx NO añade X-Forwarded-For por su cuenta: sin esta línea
    # reenviaría intacta la que mande el cliente y Express (NUM_PROXIES=1)
    # se creería una IP inventada.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    # El canal de la mesa de procesión pide no pasar por búferes
    # (X-Accel-Buffering: no). nginx lo cumple y se lo come; con otro nginx
    # delante (docker/nginx/sitio-tras-proxy.conf), ese necesita verlo también.
    proxy_pass_header X-Accel-Buffering;
}

# El sitemap lo arma la API con los módulos encendidos y las noticias
# publicadas (ya no es un fichero de la web). Coincidencia exacta: el resto de
# la raíz sigue siendo la SPA.
location = /sitemap.xml {
    proxy_pass $destino_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
}

# El alta de «Hazte hermano» adjunta la foto (5 MB) y el certificado de
# bautismo (10 MB). Coincidencia exacta: solo esta ruta sube el tope.
location = /api/auth/register {
    client_max_body_size 16m;
    proxy_pass $destino_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    # El antivirus revisa los dos documentos antes de responder.
    proxy_read_timeout 120s;
}

# Subidas del CMS: los PDF llegan a 20 MB, los vídeos a 15 MB y las fotos a
# 5 MB. Con el tope general, nginx cortaría con un 413 antes de llegar a la
# API.
location /api/upload/ {
    client_max_body_size 25m;
    proxy_pass $destino_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    # El análisis de ClamAV de un PDF grande puede tardar unos segundos.
    proxy_read_timeout 120s;
}

# Archivos públicos subidos desde el CMS, directamente del disco: no gastan
# proceso de Node ni cupo del limitador. El volumen llega en SOLO LECTURA y
# solo trae storage/public: la carpeta privada no se monta aquí y se
# descarga por la API, con sesión.
location /storage/public/ {
    alias /srv/storage/public/;
    autoindex off;
    # Los MP4 se sirven por trozos (Range), que nginx hace solo con los
    # ficheros estáticos: el navegador puede empezar a reproducir o saltar
    # sin bajarse el vídeo entero, y un visitante que se va a mitad no
    # gasta el resto. No hay gzip aquí, que anularía los trozos.
    # Sin el fragmento de la web: son fotos, vídeos y PDF, no páginas, y el CSP de
    # la web puede impedir que el navegador abra un PDF con su visor.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # El nombre de cada archivo es aleatorio y nunca se reutiliza, pero una
    # foto borrada del CMS (p. ej. la de un menor, por RGPD) seguiría
    # sirviéndose desde la caché de cada navegador todo lo que diga aquí:
    # un día es un término medio entre rendimiento y poder retirarla.
    add_header Cache-Control "public, max-age=86400";
    location ~ /\. { deny all; }
}
