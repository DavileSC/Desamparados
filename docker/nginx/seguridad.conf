# Cabeceras de seguridad de la web. Helmet las pone en Express, que solo sirve
# /api/: sin este fragmento, el HTML que de verdad ejecuta JavaScript se
# quedaría sin Content-Security-Policy y sin protección contra clickjacking.
#
# OJO: un `location` con `add_header` propio NO hereda los del `server`. Por
# eso no hay ninguno a nivel de server y este fichero se incluye en cada
# `location` de la web.
#
# Dos diferencias deliberadas respecto al CSP de helmet (copiar el de helmet
# tal cual rompe la web):
#   - frame-src https://www.google.com: el pie incrusta el mapa de Google Maps
#     tras aceptar cookies.
#   - img-src ... https: `imagenUrl` del CMS es texto libre y admite imágenes
#     alojadas fuera. Se puede cerrar el día que el CMS obligue a subirlas.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# frame-ancestors sustituye a X-Frame-Options: nadie puede incrustarnos.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; img-src 'self' data: blob: https:; frame-src https://www.google.com; upgrade-insecure-requests" always;
