# Cabeceras de seguridad de la web. Helmet las pone en Express, que solo sirve
# /api/: sin este fragmento, el HTML que de verdad ejecuta JavaScript se
# quedaría sin Content-Security-Policy y sin protección contra clickjacking.
#
# OJO: un `location` con `add_header` propio NO hereda los del `server`. Por
# eso no hay ninguno a nivel de server y este fichero se incluye en cada
# `location` de la web.
#
# Dos diferencias deliberadas respecto al CSP de helmet (copiar el de helmet
# tal cual rompe la web):
#   - frame-src: 'self' para la vista en vivo del constructor de páginas (el
#     CMS pinta la página en un iframe propio, a ancho de móvil o de tableta);
#     Google, por el mapa del pie y el bloque de mapa, que solo se cargan tras
#     aceptar cookies o pedirlos; y YouTube (sin cookies) y Vimeo, por los
#     vídeos de las galerías y del bloque de vídeo, que tampoco se cargan
#     hasta que alguien pulsa el play.
#   - img-src ... https: `imagenUrl` del CMS es texto libre y admite imágenes
#     alojadas fuera. Se puede cerrar el día que el CMS obligue a subirlas.
#   - worker-src 'self' blob: el mapa del recorrido (MapLibre) dibuja en un
#     worker que crea desde un blob. Los datos del mapa son nuestros (/mapas/):
#     no se conecta a ningún servidor de fuera.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# frame-ancestors sustituye a X-Frame-Options: nadie de fuera puede incrustarnos.
# 'self' y no 'none': el constructor de páginas incrusta la propia web.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob: https:; frame-src 'self' https://www.google.com https://www.youtube-nocookie.com https://player.vimeo.com; upgrade-insecure-requests" always;
