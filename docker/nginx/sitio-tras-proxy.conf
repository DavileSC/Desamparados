# El sitio cuando delante hay otro nginx, el del propio servidor, que es quien
# tiene los puertos 80 y 443 y el certificado (así está el VPS: ese nginx sirve
# además la página de mantenimiento). compose.servidor.yaml lo monta encima de
# /etc/nginx/conf.d/desamparados.conf, en lugar del de producción.
#
# Es el mismo sitio (snippets/desamparados-ubicaciones.conf) con dos cambios:
#
#   1. Solo http y en el 80 del contenedor, que el compose publica únicamente
#      en 127.0.0.1: desde fuera de la máquina no se llega aquí más que pasando
#      por el nginx del sistema. Sin certificado propio ni certbot.
#
#   2. La IP del visitante y el esquema llegan en cabeceras. Lo que ve este
#      nginx es la puerta de enlace de Docker, así que se toma la IP de
#      X-Forwarded-For, y solo cuando quien la manda está en una red privada
#      (la de Docker): un visitante no puede colarla. Se usa la ÚLTIMA de la
#      lista (real_ip_recursive off), que es la que añade el nginx del sistema;
#      las anteriores las puede haber escrito cualquiera. Con eso, la API sigue
#      con NUM_PROXIES=1, como en producción.
#
# El nginx del sistema tiene que mandar X-Forwarded-For y X-Forwarded-Proto
# (ver docker/servidor/nginx-pruebas.conf).

server {
    listen 80;
    server_name _;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Sin cabecera (alguien que llegue directo al puerto, desde la propia
    # máquina) se da por http, que es lo que es.
    set $proto_original $http_x_forwarded_proto;
    if ($proto_original = "") {
        set $proto_original $scheme;
    }

    include snippets/desamparados-ubicaciones.conf;
}
