# Configuración de clamd para el contenedor del antivirus.
#
# Sustituye entera a la de la imagen, así que TIENE que repetir lo suyo: sin
# `LocalSocket`, el arranque del contenedor se queda esperando un socket que
# nadie crea y clamd no llega a levantarse (y `clamdcheck.sh`, que es el
# healthcheck, tampoco tendría por dónde preguntar).
#
# Lo que se añade respecto a la de la imagen es el tope de tamaño y la recarga
# sin duplicar las firmas; lo que se quita, nada.

LogFile /var/log/clamav/clamd.log
LogTime yes

# Por donde pregunta el propio contenedor (arranque y healthcheck).
LocalSocket /tmp/clamd.sock

# Por donde pregunta la API, desde otro contenedor de la misma red. El puerto
# NO se publica al servidor: solo se llega desde la red interna del compose.
TCPSocket 3310

User clamav

# Los PDF de las publicaciones admiten hasta 20 MB. Con un tope menor, clamd
# cortaría el análisis y la subida fallaría con un 503, no con un «demasiado
# grande»: el mensaje no se parecería en nada al problema.
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M

# Al llegar firmas nuevas (varias veces al día), clamd por defecto carga la base
# nueva sin soltar la vieja y durante ese rato ocupa el doble: más de 2 GB en un
# VPS de 4. Con `no` suelta la vieja primero y el consumo no pasa de lo normal.
# El precio: mientras recarga (unos segundos), los análisis esperan. La API
# aguanta hasta 60 s por análisis (src/utils/clamd.ts), así que una subida que
# coincida tarda un poco más, pero no falla.
ConcurrentDatabaseReload no
