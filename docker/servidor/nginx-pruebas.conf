# pruebas.desamparadosmalaga.com, para el nginx DEL SISTEMA del VPS (no el del
# contenedor). Se copia a /etc/nginx/sites-available/ y se enlaza en
# sites-enabled; los pasos, en docs/servidor.md.
#
# Va solo en http a propósito: al pedir el certificado, `certbot --nginx` le
# añade el bloque 443 y la redirección, igual que hizo con el dominio
# principal. A partir de ahí este fichero ya no coincide con el del servidor,
# y no pasa nada: lo que cuenta es el de allí.
#
# Qué hace:
#   - Pide usuario y contraseña a todo el que entre. La web de pruebas no es
#     pública hasta la presentación.
#   - Salvo al aviso del banco (Redsys), que no sabe de contraseñas: sin esa
#     excepción, ningún pago de prueba se daría por cobrado. La ruta comprueba
#     ella misma la firma del banco.
#   - Le dice a los buscadores que no la indexen.
#   - Lo pasa todo al nginx del contenedor, que solo escucha en 127.0.0.1:8080.

server {
    listen 80;
    listen [::]:80;
    server_name pruebas.desamparadosmalaga.com;

    # El registro lo lleva el nginx del contenedor, que quita las consultas de
    # las URL (tokens de recuperación, búsquedas del censo). El formato de aquí
    # las guardaría.
    access_log off;

    # Los buscadores no la indexan aunque alguien enlace la dirección.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Los mismos topes que el nginx del contenedor (docker/nginx/ubicaciones.conf):
    # con el de por defecto (1 MB), este cortaría antes las subidas del CMS y
    # del alta. El de cada ruta lo sigue poniendo el de dentro.
    client_max_body_size 25m;

    # La contraseña va en cada `location` y no en el `server`: certbot añade la
    # suya para el desafío de Let's Encrypt, y con ella heredada, el desafío
    # respondería 401 y no habría certificado.
    location / {
        auth_basic "Web en pruebas";
        auth_basic_user_file /etc/nginx/pruebas.htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La IP del visitante, sustituyendo cualquier X-Forwarded-For que
        # traiga: el de dentro se fía solo del último valor (sitio-tras-proxy.conf).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La contraseña de esta puerta no tiene nada que hacer en la aplicación.
        proxy_set_header Authorization "";
        # El análisis del antivirus en las subidas grandes, y el canal de la
        # mesa de procesión, que manda un latido cada 25 s.
        proxy_read_timeout 120s;
    }

    # Chrome pide el manifest SIN las credenciales de la puerta (así lo hacen
    # los navegadores con este fichero): con contraseña, cada carga deja un
    # 401 en la consola. No lleva nada que no sea público.
    location = /manifest.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /api/pagos/redsys/notificacion {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
