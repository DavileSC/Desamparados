# desamparadosmalaga.com/Rosario: el Rosario vespertino en directo, para el
# nginx DEL SISTEMA. Se copia a /etc/nginx/snippets/rosario.conf y se incluye
# DENTRO del bloque `server` del 443 del dominio principal (el que tiene
# `listen 443 ssl`, el que añadió certbot). Pasos, en docs/servidor.md,
# «Rosario en directo».
#
# El dominio principal sigue en mantenimiento: de todo lo de la web solo se
# abren aquí la página suelta (dist-rosario/, copiada a /var/www/rosario/) y
# la posición pública del cortejo. Nada más de la API ni de la web de pruebas
# queda a la vista sin contraseña.

location = /Rosario { return 301 /Rosario/; }
location = /rosario { return 301 /Rosario/; }
location = /rosario/ { return 301 /Rosario/; }

location /Rosario/ {
    alias /var/www/rosario/;
    index index.html;
    # Un fichero que no exista es un 404, no la página de mantenimiento.
    try_files $uri $uri/ =404;

    gzip on;
    gzip_types application/json application/javascript text/css;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Los ficheros con huella en el nombre no cambian nunca: un día de caché.
location /Rosario/assets/ {
    alias /var/www/rosario/assets/;
    expires 1d;
    gzip on;
    gzip_types application/javascript text/css;
}

# Lo único de la API: dónde va el cortejo (sin quién lo manda). Lo manda la
# Junta desde «Cortejo en directo» del CMS de pruebas, con su cuenta.
location = /Rosario/posicion {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8080/api/cortejo-directo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
}
