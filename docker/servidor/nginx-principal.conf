# desamparadosmalaga.com y www, para el nginx DEL SISTEMA del VPS: sustituye
# a la página de mantenimiento. Los pasos, en docs/servidor.md, «El día de la
# presentación».
#
# Va solo en http, como el de pruebas: `certbot --nginx` le vuelve a poner el
# bloque 443 y la redirección al reinstalar el certificado que ya existe.
#
# Qué cambia respecto a nginx-pruebas.conf:
#   - Sin usuario y contraseña: es la web pública. Mientras esté cerrada desde
#     el CMS (Sistema → «Abrir la web»), quien entra ve «Próximamente».
#   - Sin `X-Robots-Tag: noindex`: con él, Google tampoco la indexaría después
#     de abrirla. «Próximamente» ya lleva su propio `noindex` en la página.
#   - Sin las excepciones del banco, Brevo y el service worker: sin
#     contraseña, ya pasan por `location /`.
#   - El nombre sin www lleva a www, que es el `dominio` de la instalación: la
#     cookie de sesión es de un solo host, y con los dos nombres abiertos se
#     tendrían dos sesiones (como en docker/nginx/sitio.conf).

server {
    listen 80;
    listen [::]:80;
    server_name www.desamparadosmalaga.com desamparadosmalaga.com;

    # El registro lo lleva el nginx del contenedor, que quita las consultas de
    # las URL (tokens de recuperación, búsquedas del censo). El formato de aquí
    # las guardaría.
    access_log off;

    # Un `if` con solo `return` dentro es de los que nginx garantiza; certbot
    # lo conserva al añadir el bloque 443.
    if ($host = desamparadosmalaga.com) {
        return 301 https://www.desamparadosmalaga.com$request_uri;
    }

    # Los mismos topes que el nginx del contenedor (docker/nginx/ubicaciones.conf).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La IP del visitante, sustituyendo cualquier X-Forwarded-For que
        # traiga: el de dentro se fía solo del último valor (sitio-tras-proxy.conf).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El análisis del antivirus en las subidas grandes, y el canal de la
        # mesa de procesión, que manda un latido cada 25 s.
        proxy_read_timeout 120s;
    }
}
